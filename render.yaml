services:
  - type: web
    name: auto-accounting-app
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/balance
    disk:
      name: data-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/accounting.db