<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>自动记账</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="自动记账">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="header">
            <h1>自动记账</h1>
            <div class="balance-display">
                <span class="balance-label">余额</span>
                <span id="balance-amount" class="balance-amount">¥0.00</span>
            </div>
        </header>

        <!-- 快速操作按钮 -->
        <section class="quick-actions">
            <button id="add-expense-btn" class="action-btn expense-btn">
                <span class="btn-icon">💰</span>
                <span>记支出</span>
            </button>
            <button id="add-income-btn" class="action-btn income-btn">
                <span class="btn-icon">💵</span>
                <span>记收入</span>
            </button>
            <button id="view-stats-btn" class="action-btn stats-btn">
                <span class="btn-icon">📊</span>
                <span>统计图表</span>
            </button>
            <button id="back-to-main-btn" class="action-btn back-btn" style="display: none;">
                <span class="btn-icon">🔙</span>
                <span>返回首页</span>
            </button>
        </section>

        <!-- 今日统计 -->
        <section class="today-stats">
            <h2>今日统计</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">收入</span>
                    <span id="today-income" class="stat-value income">¥0.00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">支出</span>
                    <span id="today-expense" class="stat-value expense">¥0.00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">结余</span>
                    <span id="today-balance" class="stat-value">¥0.00</span>
                </div>
            </div>
        </section>

        <!-- 最近交易 -->
        <section class="recent-transactions">
            <h2>最近交易</h2>
            <div id="transactions-list" class="transactions-list">
                <!-- 交易记录将在这里动态加载 -->
            </div>
            <button id="load-more-btn" class="load-more-btn">加载更多</button>
        </section>

        <!-- iOS集成提示 -->
        <section class="ios-integration" id="ios-integration">
            <h2>iOS集成</h2>
            <div class="integration-options">
                <button id="install-shortcuts-btn" class="integration-btn">
                    <span class="btn-icon">⚡</span>
                    <span>安装快捷指令</span>
                </button>
                <button id="add-to-homescreen-btn" class="integration-btn">
                    <span class="btn-icon">📱</span>
                    <span>添加到主屏幕</span>
                </button>
            </div>
            <div class="integration-info">
                <p>配置完成后，你可以：</p>
                <ul>
                    <li>通过Siri语音记账</li>
                    <li>在主屏幕快速查看余额</li>
                    <li>自动识别Apple Pay交易</li>
                    <li>解析银行短信记录</li>
                </ul>
            </div>
        </section>

        <!-- 统计页面 -->
        <div id="stats-page" style="display: none;">
            <!-- 统计图表区域 -->
            <section class="stats-charts">
                <h2>📊 支出分类统计</h2>
                <div class="chart-container">
                    <canvas id="category-chart"></canvas>
                </div>
            </section>

            <section class="stats-charts">
                <h2>📈 收支趋势</h2>
                <div class="chart-container">
                    <canvas id="trend-chart"></canvas>
                </div>
            </section>

            <!-- 详细统计数据 -->
            <section class="detailed-stats">
                <h2>📋 详细统计</h2>
                <div id="stats-summary" class="stats-summary">
                    <!-- 统计数据将在这里动态加载 -->
                </div>
            </section>
        </div>
    </div>

    <!-- 添加交易模态框 -->
    <div id="add-transaction-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">添加交易</h2>
            <form id="transaction-form" novalidate>
                <div class="form-group">
                    <label for="amount">金额 <span class="required">*</span></label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" 
                           placeholder="请输入金额" required 
                           autocomplete="off" inputmode="decimal">
                    <div class="error-message" id="amount-error"></div>
                </div>
                <div class="form-group">
                    <label for="category">分类 <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="">请选择分类</option>
                        <option value="餐饮">🍽️ 餐饮</option>
                        <option value="交通">🚗 交通</option>
                        <option value="娱乐">🎮 娱乐</option>
                        <option value="日用品">🛒 日用品</option>
                        <option value="医疗">❤️ 医疗</option>
                        <option value="服装">👕 服装</option>
                        <option value="教育">📚 教育</option>
                        <option value="其他">📁 其他</option>
                    </select>
                    <div class="error-message" id="category-error"></div>
                </div>
                <div class="form-group">
                    <label for="description">描述 <span class="required">*</span></label>
                    <input type="text" id="description" name="description" 
                           placeholder="请输入消费描述" required 
                           autocomplete="off" maxlength="50">
                    <div class="error-message" id="description-error"></div>
                </div>
                <div class="form-group">
                    <label for="currency">货币</label>
                    <select id="currency" name="currency" required>
                        <option value="EUR">€ 欧元 (EUR)</option>
                        <option value="CHF">CHF 瑞士法郎</option>
                        <option value="USD">$ 美元 (USD)</option>
                        <option value="CNY">¥ 人民币 (CNY)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">日期 <span class="required">*</span></label>
                    <input type="date" id="date" name="date" required>
                    <div class="error-message" id="date-error"></div>
                </div>
                <input type="hidden" id="type" name="type" value="expense">
                <button type="submit" class="submit-btn" id="submit-btn" tabindex="0">
                    <span class="btn-text">💾 保存</span>
                    <span class="btn-loading" style="display: none;">⏳ 保存中...</span>
                </button>
            </form>
        </div>
    </div>


    <script src="/js/app.js"></script>
</body>
</html>
